name: Spotless (Changed Modules)

on:
  pull_request:
    branches:
      - main

jobs:
  spotless-check:
    name: Spotless Check (Changed Modules)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Run spotlessCheck for changed modules
        run: |
          ./script/spotless.sh ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }}
